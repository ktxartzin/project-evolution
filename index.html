<script>
(()=>{

function jump(){if(paused||dead)return;p.jumpBuffer=.14}

const platforms1=[{x:210,y:350,w:150},{x:570,y:300,w:150}];
const platforms2=[{x:250,y:365,w:150},{x:500,y:315,w:150},{x:790,y:365,w:180},{x:1110,y:300,w:170},{x:1430,y:350,w:170},{x:1780,y:300,w:180},{x:2110,y:360,w:150}];
const secrets=[];
function update(dt){if(paused||dead)return;p.ifr=Math.max(0,p.ifr-dt);attackT=Math.max(0,attackT-dt);powerCD=Math.max(0,powerCD-dt);shieldT=Math.max(0,shieldT-dt);p.land=Math.max(0,p.land-dt);p.jumpBuffer=Math.max(0,p.jumpBuffer-dt);p.coyote=p.ground?.11:Math.max(0,p.coyote-dt);
let L=keys.left||keys.a||keys.ArrowLeft,R=keys.right||keys.d||keys.ArrowRight,target=(L?-1:0)+(R?1:0);if(p.dashT>0)p.dashT=Math.max(0,p.dashT-dt);else{if(target){p.vx+=target*(p.ground?1450:720)*dt;p.face=target}else{let f=p.ground?1850:260;p.vx=Math.abs(p.vx)<=f*dt?0:p.vx-Math.sign(p.vx)*f*dt}p.vx=Math.max(-255,Math.min(255,p.vx))}
let oldBottom=p.y+p.h;p.x+=p.vx*dt;let maxX=phase===1?W-p.w-8:worldW-p.w-8;p.x=Math.max(8,Math.min(maxX,p.x));if(p.jumpBuffer>0&&p.coyote>0){p.vy=-570;p.ground=false;p.coyote=0;p.jumpBuffer=0;p.jumpHold=.22;p.airJumps=0;fx(p.x+25,p.y+p.h-3,'#c9b7a0',5)}let held=!!(keys[' ']||keys.ArrowUp||keys.w);if(p.vy<0&&held&&p.jumpHold>0){p.vy+=1050*dt;p.jumpHold=Math.max(0,p.jumpHold-dt)}else{p.jumpHold=0;p.vy+=1280*dt}p.vy=Math.min(820,p.vy);p.y+=p.vy*dt;p.ground=false;
let pls=phase===1?platforms1:platforms2;let landing=null;if(p.vy>=0){const groundParts=phase===2&&caveOpen?[{x:0,y:floor,w:holeX},{x:holeX+holeW,y:floor,w:worldW-holeX-holeW},{x:holeX-70,y:caveFloor,w:holeW+140}]:[{x:0,y:floor,w:phase===1?W:worldW}];for(let pl of [...pls,...groundParts]){if(p.x+p.w>pl.x+4&&p.x<pl.x+pl.w-4&&oldBottom<=pl.y+2&&p.y+p.h>=pl.y&&(!landing||pl.y<landing.y))landing=pl}if(landing){p.y=landing.y-p.h;p.vy=0;p.ground=true;p.coyote=.11;p.airJumps=0}}

shots.forEach(s=>{s.x+=s.v*dt;s.t-=dt;foes.forEach(e=>{if(e.alive&&s.t>0&&Math.abs(s.x-e.x-21)<27&&Math.abs(s.y-e.y-24)<28){e.hp-=40;e.hit=.22;e.vx=Math.sign(s.v)*180;s.t=0;if(e.hp<=0){e.alive=false;addXP(40)}}})});shots=shots.filter(s=>s.t>0&&s.x>-20&&s.x<(phase===1?W:worldW));particles.forEach(a=>{a.x+=a.vx*dt;a.y+=a.vy*dt;a.vy+=300*dt;a.t-=dt});particles=particles.filter(a=>a.t>0);

let toastT=0,toastText='';function toast(t){toastText=t;toastT=2.2}function reward(id,title,desc){abilities[id]=true;overlay(`<h2>${title}</h2><p>${desc}</p><button class="action" id="continue">CONTINUAR</button>`);$('continue').onclick=closeOverlay}
function rr(x,y,w,h,r,col){g.fillStyle=col;g.beginPath();r=Math.max(0,Math.min(r,w/2,h/2));g.moveTo(x+r,y);g.lineTo(x+w-r,y);g.quadraticCurveTo(x+w,y,x+w,y+r);g.lineTo(x+w,y+h-r);g.quadraticCurveTo(x+w,y+h,x+w-r,y+h);g.lineTo(x+r,y+h);g.quadraticCurveTo(x,y+h,x,y+h-r);g.lineTo(x,y+r);g.quadraticCurveTo(x,y,x+r,y);g.closePath();g.fill()}

function drawHero(){
